[bar.main]
center = ["workspaces"]
end = ["screen-recording", "network", "battery", "clock"]
position = "top"
start = ["control-center", "cpu", "temp", "ram", "disk"]

[battery]
warning_threshold = 30

[hooks]
theme_mode_changed = "$HOME/noctalia-sync-appearance \"$NOCTALIA_THEME_MODE\""

[plugins]
enabled = ["saleh/screen-recording-status"]

[shell]
time_format = "{:%I:%M %p}"

[wallpaper]
directory = "/home/saleh/.config/wallpapers"
enabled = true
fill_mode = "crop"

[widget.clock]
format = "{:%I:%M %p}"

[widget.cpu]
stat = "cpu_usage"
type = "sysmon"

[widget.disk]
stat = "disk_used_pct"
type = "sysmon"

[widget.ram]
stat = "ram_used"
type = "sysmon"

[widget.screen-recording]
type = "saleh/screen-recording-status:indicator"

[widget.temp]
stat = "cpu_temp"
type = "sysmon"
