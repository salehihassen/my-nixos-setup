[bar.main]
center = ["workspaces"]
end = ["screen-recording", "network", "battery", "clock"]
position = "top"
start = ["control-center", "cpu", "temp", "ram", "disk"]

[battery]
warning_threshold = 30

[hooks]
theme_mode_changed = "$HOME/noctalia-sync-appearance \"$NOCTALIA_THEME_MODE\""

[plugins]
enabled = ["noctalia/screen_recorder"]

[plugin_settings."noctalia/screen_recorder"]
# Portal capture includes DisplayLink and unfamiliar office monitors.
video_source = "portal"
directory = "~/Videos"
filename_pattern = "recording-%Y-%m-%d_%H-%M-%S"
audio_source = "none"
hide_inactive = false
glyph_idle = "video-off"
glyph_recording = "player-record"

[shell]
time_format = "{:%I:%M %p}"

[wallpaper]
directory = "/home/saleh/.config/wallpapers"
enabled = true
fill_mode = "crop"

[widget.clock]
format = "{:%I:%M %p}"

[widget.cpu]
stat = "cpu_usage"
type = "sysmon"

[widget.disk]
stat = "disk_used_pct"
type = "sysmon"

[widget.ram]
stat = "ram_used"
type = "sysmon"

[widget.screen-recording]
type = "noctalia/screen_recorder:recorder"

[widget.temp]
stat = "cpu_temp"
type = "sysmon"
