# ~/.tmux.conf
 
# ============================================
# ESSENTIAL SETTINGS
# ============================================
 
# Fix Vim ESC delay (tmux 3.5+ already defaults to 10ms)
set -sg escape-time 0
 
# Increase scrollback buffer
set -g history-limit 50000
 
# Start windows and panes at 1, not 0
# set -g base-index 1
# setw -g pane-base-index 1
 
# Enable mouse support
set -g mouse on
 
# Enable focus events for vim autoread
set -g focus-events on
 
# Set terminal with proper colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
 
# Aggressive resize for multi-client
setw -g aggressive-resize on

# Forward modified keys (Shift+Enter, Ctrl+Enter) to apps such as pi.
# CSI-u is the most reliable format on tmux 3.5+.
set -g extended-keys on
set -g extended-keys-format csi-u
 
# ============================================
# KEY BINDINGS
# ============================================
 
# Change prefix to Ctrl+a (more ergonomic)
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix
 
# Reload config from either the XDG path (Home Manager) or ~/.tmux.conf.
bind r run-shell 'config="${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux.conf"; [ -f "$config" ] || config="$HOME/.tmux.conf"; tmux source-file "$config" && tmux display-message "Config reloaded!"'
 
# Better pane splitting (and keep current path)
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
# bind c new-window -c "#{pane_current_path}"
 
# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
 
# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
 
# ============================================
# APPEARANCE
# ============================================
 
# Status bar position
# set -g status-position top
 
# Status bar colors use the terminal's own background/foreground and ANSI
# palette names instead of hex values, so the bar follows Ghostty's light and
# dark themes. "fg=blue,reverse" draws a blue pill with background-colored text.
set -g status-style 'bg=default,fg=default'
set -g status-left-length 20
set -g status-right-length 60
 
# Status bar content (#h = short hostname)
# set -g status-left '#[fg=#00e68a,bold] #S #[fg=#30363d]│ '
set -g status-right '#[dim]%I:%M %p  %d-%b-%y #[none] #[fg=blue,reverse,bold] #h #[none]'
 
# Window status
# setw -g window-status-format ' #I:#W '
# setw -g window-status-current-format '#[fg=#00e68a,bold] #I:#W '
setw -g window-status-current-style 'fg=blue,bold'
 
# Pane border colors
set -g pane-border-style 'fg=#30363d'
set -g pane-active-border-style 'fg=#00e68a'
 
# Pane scrollbars — show scrollback position (tmux 3.6+)
set -g pane-scrollbars on
set -g pane-scrollbars-position right
 
# Message styling
set -g message-style 'bg=#00e68a fg=#000000 bold'
 
# ============================================
# COPY MODE
# ============================================
 
# Use vi keys
setw -g mode-keys vi
 
# Vi-style copy bindings
bind -T copy-mode-vi v send -X begin-selection
# bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"  # macOS
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -i"  # Linux
 
# ============================================
# PLUGINS (installed by Home Manager)
# ============================================
 
# Plugin settings
# Nix runs Neovim as /nix/store/...-neovim-unwrapped-<version>/bin/nvim, which Resurrect's
# default "nvim" match misses. Match it anywhere and restore through PATH so a
# restore never points at a garbage-collected store path.
set -g @resurrect-processes '"~/bin/nvim->nvim"'
set -g @continuum-restore 'on'

# Home Manager generates this bridge with the current pinned Nix store paths.
# Without Home Manager the base configuration still loads, just without plugins.
# Keep this last: Continuum adds its autosave hook to the status-right set above.
source-file -Fq '#{?#{E:XDG_CONFIG_HOME},#{E:XDG_CONFIG_HOME},#{E:HOME}/.config}/tmux/nix-plugins.conf'
